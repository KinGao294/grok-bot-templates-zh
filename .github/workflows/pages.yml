name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Import site content on first run
        env:
          BUNDLE_URL: https://temporary-snappy-magenta-xd3u86b.vercel.app/grok-bot-templates-zh.tar.gz
        run: |
          if [ -f index.html ]; then
            echo "Site content already committed; nothing to import."
            exit 0
          fi
          curl -fsSL "$BUNDLE_URL" -o /tmp/site.tar.gz
          tar -xzf /tmp/site.tar.gz -C .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import static site content"
          git push

      - name: Assemble publish directory
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/
          ls -la _site

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
